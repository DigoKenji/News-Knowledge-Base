# Typed edges between concepts. Allowed types: is-a, part-of, uses, alternative-to, tradeoff-with, mitigates, extends.
relations:
  - { from: graph-rag,      type: extends,        to: rag }
  - { from: vectorless-rag, type: alternative-to, to: rag }
  - { from: saga-pattern,   type: mitigates,      to: cap-theorem }   # consistency across services
  - { from: strangler-fig,  type: uses,           to: bounded-context }
  - { from: atam,           type: part-of,        to: adr }
  - { from: oidc,           type: extends,        to: oauth2 }
  - { from: kv-cache,       type: part-of,        to: inference-tradeoffs }
  - { from: concept-drift,  type: alternative-to, to: data-drift }   # distinct drift types, often confused
